name: Playwright Tests
on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  regression-tests:
    timeout-minutes: 60
    runs-on: ubuntu-latest
    environment: RP_PROD
    env:
      BASE_URL: http://localhost:8080
      HEADLESS: true
      PASSWORD_ADMIN: ${{ secrets.PASSWORD_ADMIN }}
      LOGIN_ADMIN: ${{ secrets.LOGIN_ADMIN }}
      PASSWORD_DEFAULT: ${{ secrets.PASSWORD_DEFAULT }}
      LOGIN_DEFAULT: ${{ secrets.LOGIN_DEFAULT }}
    steps:
      - uses: actions/checkout@v4

      - name: Check Docker
        run: |
          docker --version
          docker compose version

      - name: Start ReportPortal
        run: docker compose -f docker/docker-compose.yml -p reportportal up -d --force-recreate

      - name: Wait for ReportPortal to be ready
        run: |
          for i in {1..30}; do
            if curl -fsS http://localhost:8080/ui/ >/dev/null; then
              echo "ReportPortal is ready on http://localhost:8080"
              exit 0
            fi
            echo "Waiting for ReportPortal... attempt $i/30"
            sleep 10
          done
          echo "ReportPortal did not become ready in time"
          docker compose -f docker/docker-compose.yml ps
          docker compose -f docker/docker-compose.yml logs --tail=200
          exit 1

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: lts/*

      - name: Install dependencies
        run: npm ci

      - name: Install Playwright Chromium
        run: npx playwright install --with-deps chromium

      - name: Run Playwright tests UI
        id: ui-tests
        run: npm run test:ui  

      - name: Run Playwright tests API
        if: ${{ !cancelled() && steps.ui-tests.outcome != 'skipped' }}
        run: npm run test:api

      - uses: actions/upload-artifact@v4
        if: ${{ !cancelled() }}
        with:
          name: playwright-report
          path: playwright-report/
          retention-days: 30

      - name: Stop ReportPortal
        if: always()
        run: docker compose -f docker/docker-compose.yml down --volumes --remove-orphans
