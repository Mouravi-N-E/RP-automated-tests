name: Playwright Tests
on:
  push:
    branches:  [main, CI/CD-home-task ]
  pull_request:
    branches: main
jobs:
  build-rp:
    timeout-minutes: 60
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: check docker
        run: |
          docker --version
          docker compose version

